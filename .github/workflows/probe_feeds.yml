name: Probe Feeds

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe candidate feeds
        run: |
          python3 - <<'PY'
          import urllib.request, re, sys
          urls = [
            "https://huggingface.co/blog/feed.xml",
            "https://x.ai/news/rss.xml",
            "https://x.ai/blog/rss.xml",
            "https://x.ai/rss.xml",
            "https://rsshub.app/anthropic/news",
            "https://www.globaltimes.cn/rss/outbrain.xml",
            "https://www.globaltimes.cn/rss/china.xml",
            "https://tech.bytedance.net/rss.xml",
            "https://www.volcengine.com/rss",
          ]
          for u in urls:
            try:
              req = urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0 (compatible; RSSBot/1.0)"})
              with urllib.request.urlopen(req, timeout=20) as r:
                body = r.read(600000).decode("utf-8", "ignore")
                n = len(re.findall(r"<item|<entry", body))
                print(f"OK  {r.status}  items={n:<4} {u}")
            except Exception as e:
              print(f"ERR {type(e).__name__}: {str(e)[:70]:<70} {u}")
          PY
