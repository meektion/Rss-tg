name: Sync Articles to Telegram

on:
  schedule:
    - cron: '3 2 * * *'      # 早报：北京时间 10:03（避开整点高负载窗口，降低被延迟/丢弃概率）
    - cron: '3 9 * * *'      # 晚报：北京时间 17:03（避开整点高负载窗口）
    - cron: '3 8,16 * * *'   # 连续推送：北京时间 16:03 / 次日 0:03
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - morning
          - evening

permissions:
  contents: write

concurrency:
  group: sync-articles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "3 2 * * *")   echo "mode=morning" >> "$GITHUB_OUTPUT";;
              "3 9 * * *")   echo "mode=evening" >> "$GITHUB_OUTPUT";;
              "3 8,16 * * *") echo "mode=normal"  >> "$GITHUB_OUTPUT";;
              *)             echo "mode=normal"  >> "$GITHUB_OUTPUT";;
            esac
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run sync script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: python sync_articles.py

      - name: Commit sent-articles cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f sent_articles.json ]; then
            git add sent_articles.json
            if git diff --cached --quiet; then
              echo "缓存无变化，跳过提交"
            else
              git commit -m "chore: update sent articles cache [skip ci]"
              git pull --rebase --autostash origin ${GITHUB_REF_NAME}
              git push origin ${GITHUB_REF_NAME}
            fi
          else
            echo "sent_articles.json 不存在，跳过"
          fi
