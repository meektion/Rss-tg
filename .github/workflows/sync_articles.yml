name: Sync Articles to Telegram

on:
  schedule:
    - cron: '3 2 * * *'      # 早报：北京时间 10:03（避开整点高负载窗口，降低被延迟/丢弃概率）
    - cron: '3 9 * * *'      # 晚报：北京时间 17:03（避开整点高负载窗口）
    - cron: '3 8,16 * * *'   # 连续推送：北京时间 16:03 / 次日 0:03
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - morning
          - evening

permissions:
  contents: write

concurrency:
  group: sync-articles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "3 2 * * *")   echo "mode=morning" >> "$GITHUB_OUTPUT";;
              "3 9 * * *")   echo "mode=evening" >> "$GITHUB_OUTPUT";;
              "3 8,16 * * *") echo "mode=normal" >> "$GITHUB_OUTPUT";;
              *)             echo "mode=normal"  >> "$GITHUB_OUTPUT";;
            esac
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run sync script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: python sync_articles.py

      - name: Commit sent-articles cache safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ ! -f sent_articles.json ]; then
            echo "sent_articles.json 不存在，跳过"
            exit 0
          fi

          # JSON cache cannot be safely line-merged by Git. Merge keys and prefer the newest pushed_at.
          for attempt in 1 2 3; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --mixed "origin/${GITHUB_REF_NAME}"
            python - <<'PY'
          import datetime
          import json
          import subprocess
          from pathlib import Path

          path = Path("sent_articles.json")
          try:
              local = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              local = {}
          try:
              remote_text = subprocess.check_output(
                  ["git", "show", f"origin/{__import__('os').environ['GITHUB_REF_NAME']}:sent_articles.json"],
                  text=True,
              )
              remote = json.loads(remote_text)
          except (subprocess.CalledProcessError, json.JSONDecodeError):
              remote = {}

          merged = dict(remote) if isinstance(remote, dict) else {}
          if isinstance(local, dict):
              for key, value in local.items():
                  previous = merged.get(key)
                  if not isinstance(previous, dict):
                      merged[key] = value
                  elif isinstance(value, dict) and value.get("pushed_at", "") >= previous.get("pushed_at", ""):
                      merged[key] = value

          cutoff = (datetime.datetime.now() - datetime.timedelta(days=30)).strftime("%Y-%m-%d")
          merged = {
              key: value for key, value in merged.items()
              if isinstance(value, dict) and value.get("pushed_at", "")[:10] >= cutoff
          }
          path.write_text(
              json.dumps(merged, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(f"Merged cache: {len(merged)} records")
          PY
            git add sent_articles.json
            if git diff --cached --quiet; then
              echo "缓存无变化，无需提交"
              exit 0
            fi
            git commit -m "chore: update sent articles cache [skip ci]"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              echo "缓存提交成功"
              exit 0
            fi
            echo "推送遇到并发更新，第 ${attempt} 次尝试后重试"
          done
          echo "缓存提交连续失败，请检查远程分支更新" >&2
          exit 1
